name: Deploy Marimo App to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      modules_ref:
        description: 'Branch or SHA to checkout from CROSSROADS-DS/public-modules'
        required: false
        default: 'main'
        type: string
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Checkout public-modules
        uses: actions/checkout@v4
        with:
          repository: 'CROSSROADS_DS/public-modules'
          ref: ${{ inputs.modules_ref || 'main' }}
          path: public-modules

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Marimo and uv
        run: |
          python -m pip install --upgrade pip
          pip install marimo uv
          
      - name: Batch Export Notebooks via Automation Script
        run: |
          python scripts/build.py
 
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html
 
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
 
    permissions:
      pages: write
      id-token: write
 
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
